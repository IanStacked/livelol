name: CI Pipeline

# The AWS EC2 host was torn down on 2026-09-28; the deploy job (Docker Hub push
# + ssh-action deploy to EC2) was removed with it. The last deployed image tags
# remain on Docker Hub under league-bot.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync

      - name: Run Pytest
        run: uv run pytest

  # Validate the Dockerfile builds on every PR (build only, no push), so a broken
  # image is caught BEFORE it can merge to main.
  docker-build:
    name: Validate Docker build (no push)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Build image without pushing
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: league-bot:pr-${{ github.sha }}
