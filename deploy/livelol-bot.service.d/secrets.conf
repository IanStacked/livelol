# Secrets for the unit: names only; values stay in ~/.secrets.sh and the sink token file.
[Service]
Environment=SINK_URL=http://127.0.0.1:8787
ExecStart=
ExecStart=/bin/bash -c 'for a in "$$@"; do v="$${a#*:}"; f="$$HOME/.secrets.sh"; [ "$${a%%%%:*}" = sink ] && f="$$HOME/.everythingdev-sink.env"; export "$$v=$$(. "$$f" >/dev/null 2>&1; printf %%s "$${!v}")"; done; exec /usr/bin/env SINK_TOKEN="$$SINK_INGEST_TOKEN" python main.py' _ secrets:DISCORD_PUBLIC_KEY secrets:RIOT_API_KEY secrets:FIREBASE_CREDENTIALS_BASE64 sink:SINK_INGEST_TOKEN
